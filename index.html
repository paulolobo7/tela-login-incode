<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incode Tech School - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="auth-card" aria-labelledby="login-title">
        <header class="hero">
          <figure class="logo-box">
            <img src="public/image.png" alt="Logo da Incode Tech School" />
          </figure>

          <p class="hero-text">
            Bem-vindo a <strong>Incode Tech School</strong>
          </p>
        </header>

        <section class="auth-section" aria-labelledby="register-title">
          <h1 id="register-title">Cadastre-se</h1>

          <div class="social-links" aria-label="Opcoes de cadastro rapido">
            <a
              class="social-link"
              href="https://myaccount.google.com/?utm_source=sign_in_no_continue&pli=1"
            >
              <span class="social-icon" aria-hidden="true">
                <img
                  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKXZFRxjJ3Su_OlLiCYHzVq7p5rKPgBZTnnF1mYIx1BR0dL2sa1_6spdug&s=10"
                  alt=""
                />
              </span>
              Continue com o Google
            </a>

            <a class="social-link" href="https://x.com/?lang=pt">
              <span class="social-icon" aria-hidden="true">
                <img
                  src="https://img.magnific.com/vetores-premium/twitter-vetor-logotipo-logotipo-vetor-midia-social_901408-401.jpg?semt=ais_hybrid&w=740&q=80"
                  alt=""
                />
              </span>
              Continue com o Twitter
            </a>
          </div>
        </section>

        <section class="auth-section" aria-labelledby="login-title">
          <h2 id="login-title">Faça login</h2>

          <form class="login-form">
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Digite seu email"
                autocomplete="email"
              />
            </div>

            <div class="field">
              <label for="password">Senha</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
              />
            </div>

            <button class="submit-button" type="submit">Entrar</button>
          </form>
        </section>
      </section>
    </main>
  </body>
</html>
